<!DOCTYPE html>
<html>
<head>
  <title>HGV Workshop Finder</title>
  <meta charset="UTF-8">
</head>

<body>

<h2>HGV Workshop Finder</h2>

<input id="postcode" placeholder="Enter postcode">
<button onclick="findWorkshops()">Search</button>

<div id="map" style="height:500px; margin-top:20px;"></div>
<div id="workshop-list" style="margin-top:20px;"></div>

<hr>
<h3>Workshop Editor</h3>

<input id="w-id" type="hidden">
<input id="w-name" placeholder="Name"><br><br>
<input id="w-lat" placeholder="Latitude"><br><br>
<input id="w-lng" placeholder="Longitude"><br><br>
<input id="w-phone-main" placeholder="Main Phone"><br><br>
<input id="w-phone-mobile" placeholder="Mobile Phone"><br><br>
<input id="w-phone-out" placeholder="Out of Hours"><br><br>
<input id="w-email" placeholder="Email"><br><br>

<button onclick="saveWorkshop()">Save Workshop</button>

<hr>
<h3>Bulk Import</h3>
<textarea id="bulk-input" style="width:100%;height:120px;" placeholder="name,lat,lng,phoneMain,phoneMobile,phoneOutHours,email"></textarea><br>
<button onclick="bulkImport()">Bulk Import</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6p5E2vQ-PzafSR7wriDUZRLI1dgtN5o8",
  authDomain: "hgv-workshop-finder.firebaseapp.com",
  databaseURL: "https://hgv-workshop-finder-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "hgv-workshop-finder",
  storageBucket: "hgv-workshop-finder.appspot.com",
  messagingSenderId: "540661085613",
  appId: "1:540661085613:web:199992f2ad1c4f5cb29d24"
};

const app  = initializeApp(firebaseConfig);
const db   = getDatabase(app);

let workshops       = {};
let map             = null;
let workshopMarkers = [];
let breakdownMarker = null;

// --- map init ---
window.initMap = function() {
  map = new google.maps.Map(
    document.getElementById("map"),
    { center: { lat: 54.5, lng: -3 }, zoom: 6 }
  );

  onValue(ref(db, "workshops"), snap => {
    workshops = snap.val() || {};
    clearWorkshopMarkers();
    document.getElementById("workshop-list").innerHTML = "";
  });
};

function clearWorkshopMarkers() {
  workshopMarkers.forEach(m => m.setMap(null));
  workshopMarkers = [];
}

// --- postcode + distance ---
function formatPostcode(pc) {
  pc = pc.toUpperCase().replace(/\s+/g, "");
  return pc.length < 5 ? pc : pc.slice(0, pc.length - 3) + " " + pc.slice(pc.length - 3);
}

function haversine(aLat, aLng, bLat, bLng) {
  const R = 6371;
  const dLat = (bLat - aLat) * Math.PI / 180;
  const dLng = (bLng - aLng) * Math.PI / 180;
  const A =
    Math.sin(dLat / 2) ** 2 +
    Math.cos(aLat * Math.PI / 180) *
    Math.cos(bLat * Math.PI / 180) *
    Math.sin(dLng / 2) ** 2;
  return R * (2 * Math.atan2(Math.sqrt(A), Math.sqrt(1 - A)));
}

// --- nearest list + green pins ---
function renderNearest(list) {
  const listDiv = document.getElementById("workshop-list");

  clearWorkshopMarkers();
  listDiv.innerHTML = "";

  list.forEach(w => {
    const marker = new google.maps.Marker({
      position: { lat: w.lat, lng: w.lng },
      map,
      title: `${w.name} (${w.distanceKm.toFixed(1)} km)`,
      icon: "https://maps.google.com/mapfiles/ms/icons/green-dot.png"
    });

    marker.addListener("click", () => {
      new google.maps.InfoWindow({
        content: `
          <strong>${w.name}</strong><br>
          ${w.distanceKm.toFixed(1)} km from breakdown<br><br>

          <strong>Main:</strong> ${w.phoneMain || "N/A"}<br>
          <strong>Mobile:</strong> ${w.phoneMobile || "N/A"}<br>
          <strong>Out of Hours:</strong> ${w.phoneOutHours || "N/A"}<br>
          <strong>Email:</strong> ${w.email || "N/A"}
        `
      }).open(map, marker);
    });

    workshopMarkers.push(marker);

    listDiv.innerHTML += `
      <strong>${w.name}</strong> (${w.distanceKm.toFixed(1)} km)<br>
      <button onclick="zoomToWorkshop('${w.id}')">Zoom</button>
      <button onclick="editWorkshop('${w.id}')">Edit</button>
      <button onclick="deleteWorkshop('${w.id}')">Delete</button>
      <hr>
    `;
  });
}

// --- public functions ---
window.findWorkshops = function() {
  const raw = document.getElementById("postcode").value.trim();
  if (!raw) {
    alert("Enter a postcode.");
    return;
  }

  const formatted = formatPostcode(raw);

  fetch(`https://maps.googleapis.com/maps/api/geocode/json?address=${encodeURIComponent(formatted)}&components=country:GB&key=AIzaSyB6p5E2vQ-PzafSR7wriDUZRLI1dgtN5o8`)
    .then(r => r.json())
    .then(d => {
      if (!d.results || !d.results.length) {
        alert("Postcode not found.");
        return;
      }

      const loc = d.results[0].geometry.location;

      // red breakdown pin
      if (breakdownMarker) breakdownMarker.setMap(null);
      breakdownMarker = new google.maps.Marker({
        position: loc,
        map,
        icon: "https://maps.google.com/mapfiles/ms/icons/red-dot.png",
        title: "Breakdown location"
      });

      map.setCenter(loc);
      map.setZoom(11);

      if (!workshops || !Object.keys(workshops).length) {
        alert("No workshops in database.");
        clearWorkshopMarkers();
        document.getElementById("workshop-list").innerHTML = "";
        return;
      }

      const nearest = Object.entries(workshops)
        .map(([id, w]) => ({
          id,
          ...w,
          distanceKm: haversine(loc.lat, loc.lng, w.lat, w.lng)
        }))
        .sort((a, b) => a.distanceKm - b.distanceKm)
        .slice(0, 20);

      renderNearest(nearest);
    })
    .catch(() => alert("Geocoding failed."));
};

window.zoomToWorkshop = id => {
  const w = workshops[id];
  if (!w || !map) return;
  map.setCenter({ lat: w.lat, lng: w.lng });
  map.setZoom(13);
};

window.editWorkshop = id => {
  const w = workshops[id];
  if (!w) return;

  document.getElementById("w-id").value          = id;
  document.getElementById("w-name").value        = w.name || "";
  document.getElementById("w-lat").value         = w.lat || "";
  document.getElementById("w-lng").value         = w.lng || "";
  document.getElementById("w-phone-main").value  = w.phoneMain || "";
  document.getElementById("w-phone-mobile").value= w.phoneMobile || "";
  document.getElementById("w-phone-out").value   = w.phoneOutHours || "";
  document.getElementById("w-email").value       = w.email || "";
};

window.deleteWorkshop = id => {
  if (!confirm("Delete workshop?")) return;
  remove(ref(db, "workshops/" + id))
    .catch(() => alert("Delete failed."));
};

window.saveWorkshop = function() {
  const id   = document.getElementById("w-id").value.trim();
  const name = document.getElementById("w-name").value.trim();
  const lat  = parseFloat(document.getElementById("w-lat").value.trim());
  const lng  = parseFloat(document.getElementById("w-lng").value.trim());
  const phoneMain   = document.getElementById("w-phone-main").value.trim();
  const phoneMobile = document.getElementById("w-phone-mobile").value.trim();
  const phoneOut    = document.getElementById("w-phone-out").value.trim();
  const email       = document.getElementById("w-email").value.trim();

  if (!name || isNaN(lat) || isNaN(lng)) {
    alert("Name, lat, lng required.");
    return;
  }

  const data = { name, lat, lng, phoneMain, phoneMobile, phoneOutHours: phoneOut, email };

  if (id) {
    update(ref(db, "workshops/" + id), data)
      .then(() => alert("Workshop updated."))
      .catch(() => alert("Update failed."));
  } else {
    set(push(ref(db, "workshops")), data)
      .then(() => alert("Workshop added."))
      .catch(() => alert("Add failed."));
  }
};

window.bulkImport = function() {
  const text = document.getElementById("bulk-input").value.trim();
  if (!text) {
    alert("Paste CSV lines first.");
    return;
  }

  text.split("\n").forEach(line => {
    const p = line.split(",").map(x => x.trim());
    if (p.length < 7) return;

    const data = {
      name: p[0],
      lat: parseFloat(p[1]),
      lng: parseFloat(p[2]),
      phoneMain: p[3],
      phoneMobile: p[4],
      phoneOutHours: p[5],
      email: p[6]
    };

    if (!data.name || isNaN(data.lat) || isNaN(data.lng)) return;
    set(push(ref(db, "workshops")), data);
  });

  alert("Bulk import complete.");
};

// wait for Maps JS
window.addEventListener("load", () => {
  if (window.google && window.google.maps) {
    initMap();
  } else {
    const i = setInterval(() => {
      if (window.google && window.google.maps) {
        clearInterval(i);
        initMap();
      }
    }, 200);
  }
});
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB6p5E2vQ-PzafSR7wriDUZRLI1dgtN5o8" async defer></script>

</body>
</html>
